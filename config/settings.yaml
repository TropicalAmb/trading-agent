mode: paper  # paper | live — live also requires ALLOW_LIVE_TRADING=true in .env

# Version stamp for BEFORE vs AFTER optimization comparison (do not erase old journals)
config_version: router_v1_paperfix1
# Paper stamp: location engines aligned to R>=1.6 + no false VWAP POOR kill; NQ specialist wired; EMA research_only
strategy_version: performance_router_v1
execution_profile: balanced  # balanced | high_confidence

# Identity for multi-agent deployments (override per compose profile / agent yaml)
agent_id: agent_1
agent_profile: balanced

# decision_pipeline = independent engines → A+/A/B/C tiers → ranker (default)
# Legacy: confluence | vwap_acceptance | vwap_orb | sweep_retest
active_strategy: decision_pipeline

# Optional extra gate: TradingView alert must also match (usually leave false for full autonomy)
require_tv_alert_confluence: false

# Market data provider (swap later without rewriting strategies)
market_data:
  provider: yahoo_delayed
  bar_interval: 5m   # strategy timeframe (scheduler is 1m — these differ)
  bar_period: 10d
  estimated_delay_seconds: 780          # ~13m typical Yahoo
  expected_delay_seconds: 900           # ~15m expected feed delay
  stale_extra_tolerance_seconds: 420    # stale = expected + bar_interval + this
  # Do NOT set stale_after_seconds unless overriding the formula for ops/tests
  request_timeout_sec: 40
  max_retries: 3
  bar_cursor_path: data/bar_cursors.json
  last_evaluation_path: data/last_evaluation.json
  # Databento historical (research). Keep yahoo_delayed for paper until key works.
  databento_dataset: GLBX.MDP3
  databento_schema: ohlcv-1m
  databento_default_lookback_days: 60

# Shadow B research lifecycle (does not affect paper equity)
shadow:
  research_horizon_bars: 36          # ~3h on 5m bars
  research_horizon_minutes: 180
  path: data/shadow_trades.json

# Supervisor stuck detection (NO_NEW_BAR is NOT stuck)
observability:
  scheduler_expected_seconds: 60
  scheduler_warning_seconds: 90
  scheduler_stuck_seconds: 150

# Autonomous paper silence / blocker watch (watchdog + live cycle + dashboard)
# Does not relax quality gates — diagnoses why no fills and alerts / restarts on bug patterns
trade_silence_watch:
  enabled: true
  warn_after_minutes: 90
  alert_after_minutes: 90   # aligned with drought fault clock
  lookback_decisions: 250
  bug_window_minutes: 45   # only recent rejects drive RESEARCH_SUPERSEDE / EXEC_ERROR alerts
  path: data/trade_silence_status.json
  log_path: data/trade_silence.log
  decisions_path: data/execution_decisions.jsonl
  auto_restart_on_bug_patterns: true
  restart_cooldown_minutes: 60

# Open-session paper drought = fault (NOT gate easing / NOT EMA spray)
trade_drought_policy:
  enabled: true
  max_quiet_minutes: 90
  sessions: [london, ny, asia]
  on_drought: diagnose_and_escalate

# Contract sizing — multi-lot after strategy tighten; always fit under risk hard cap
quantity:
  default_quantity: 2
  max_quantity: 25
  # Target lots by tier (fit_quantity_to_risk may shrink to keep ≤ max_risk_dollars_per_trade)
  quantity_by_tier:
    A+: 3
    A: 2
  quantity_by_symbol: {}
  quantity_by_strategy: {}
  quantity_by_agent_profile:
    balanced: 2
    momentum: 2
    liquidity: 2
    trend: 2

# Setup tiers: trade A+ and A by default; journal B; reject C for execution
tiering:
  minimum_trade_tier: A
  a_plus_min_confidence: 85
  a_min_confidence: 75
  b_min_confidence: 55
  a_plus_min_r: 1.4
  a_min_r: 1.4
  # Used by global-score tier path (score alone cannot mint A+)
  tier_thresholds:
    A_PLUS: 85
    A: 75
    B: 58
    C: 0

# IRL-style paper gate (does not narrow universe / max positions / risk dollars)
# Fewer trades, only when payoff is meaningful and evidence isn't a lone scrape
execution_quality:
  enabled: true
  min_expected_r: 1.6
  min_reward_dollars: 150
  min_agreeing_engines: 2   # no single-engine spray (specialists exempt)
  ema_pullback_requires_partner: true
  reject_poor_cascade_location: true
  # Thin engines: still prefer aligned thesis. Location engines (liquidity_sweep etc.)
  # may paper when MTF is imperfect — cascade stays journaled for research.
  require_non_mixed_thesis: true
  location_may_trade_mixed_thesis: true
  # Breakout/OR/sweep often print >1.5 ATR from VWAP; do not VWAP-distance-kill them.
  location_may_trade_away_from_vwap: true

# Portfolio coordinator across agents on same account
portfolio:
  allow_opposite_same_symbol: false
  allow_duplicate_same_trade: false

# Engines run independently; agreement boosts confidence but is NOT mandatory for proposals
confluence:
  min_engines_agree: 1
  must_include_one_of: []
  engines:
    - liquidity_sweep   # PDH/PDL sweep reclaim
    - vwap_acceptance   # acceptance / location VWAP engine (kept)
    - sweep_retest
    - momentum          # breakout continuation (PRESENT ≠ ENTRY_VALID)
    - breakout_retest   # resistance break + hold/retest (no chase)
    - opening_range     # London/NY OR breakout+retest / failed OR
    - vwap_orb          # ORB + VWAP filter (accuracy research)
    - vwap_mss          # VWAP + MSS + MTF3 (paper vwap_mss_v1)
    - cl_vwap_prox_momentum  # PAPER: validated CL specialist v1 (exact research definition)
    - nq_context_entry       # PAPER: Databento WR>=65% PULLBACK BUY champion
  max_risk_dollars: 180
  min_reward_dollars: 150
  min_rr: 1.6

# Shadow/research only — still evaluated & journaled, NOT paper-executable
research_only_engines:
  - ema_pullback         # was 39/64 lifetime fills; spray engine → shadow until proven with partners
  - trend_continuation   # thin single-engine scrapes
  - trend_pullback
  - liquidity_reversal
  - vwap_reclaim
  - indicator_parity  # TV MTF Sweep Retest 1:1 — research/shadow until OOS proves paper worth
  - nq_ny_open_momentum    # NQ NY-open — SHADOW ONLY (not promoted)

# Paper-executable validated specialists (tier floor A when cascade OK; still hard-risk gated)
paper_specialist_engines:
  - cl_vwap_prox_momentum
  - nq_context_entry

# Five-layer cascade (additive context; hard risk unchanged)
trade_cascade:
  enabled: true
  hard_reject_poor_fit: true
  require_for_specialists: true

# Strategy kill / drift lifecycle — EXPLICIT ordered thresholds (no ranges)
# Evidence: hist maxDD=-5R, MC p95 DD≈-6R → WATCH=-5, SHADOW=-7.5, HARD=-9
strategy_lifecycle:
  enabled: true
  path: data/strategy_lifecycle.json
  cl_vwap_prox_momentum:
    watch_dd_r: -5.0
    shadow_dd_r: -7.5
    hard_kill_r: -9.0
    equity_book_key: CL_BOOK   # aggregate CL+MCL R equity
  nq_context_entry:
    watch_dd_r: -5.0
    shadow_dd_r: -7.5
    hard_kill_r: -9.0
    equity_book_key: NQ_BOOK   # aggregate NQ+MNQ R equity

# CL specialist — EXACT validated definition (do not tweak during forward sample)
cl_vwap_prox_momentum:
  enabled: true
  symbols: [CL, MCL]
  max_abs_vwap_atr: 0.25
  stop_atr_mult: 1.0
  target_r_multiple: 2.0
  strategy_version: cl_vwap_prox_momentum_v1
  prefer_micro_when_risk_exceeded: true  # remap CL→MCL; never widen stop

# NQ_CONTEXT_ENTRY — locked Databento WR>=65% champion (do not tweak during forward sample)
nq_context_entry:
  enabled: true
  symbols: [NQ, MNQ]
  trigger: PULLBACK
  window: "0930_1200"
  confirmation: signal_close
  sides: [BUY]
  zone_atr: 0.30
  stop_atr: 0.55
  vwap_buffer_atr: 0.20
  cooldown_bars: 2
  target_r_multiple: 1.15
  min_stop_atr: 0.385
  strategy_version: nq_context_entry_pullback_v1
  prefer_micro_when_risk_exceeded: true  # remap NQ→MNQ; never widen stop

# NQ NY-open specialist — promising / not confirmed
nq_ny_open_momentum:
  enabled: true
  symbols: [NQ, MNQ]
  sessions: [ny_open]
  stop_atr_mult: 1.0
  target_r_multiple: 2.0
  strategy_version: nq_ny_open_momentum_v1

# Multi-session open momentum research (asia/london/ny_open) — SHADOW/research only
session_open_momentum:
  enabled: true
  symbols: [NQ, MNQ, ES, MES]
  sessions: [asia, london, ny_open]
  stop_atr_mult: 1.0
  target_r_multiple: 2.0
  strategy_version: session_open_momentum_v1
  paper_executable: false

# Optional evidence table for cascade Layer-1 POOR_FIT (from specialist validation)
strategy_fit_evidence:
  cl_vwap_prox_momentum:
    CL:
      validated_positive: true
      n: 121
      min_n_for_poor_fit: 30
      poor_vol_regimes: []  # do not skip regimes until adequate negative evidence
    MCL:
      validated_positive: true
      n: 121
      min_n_for_poor_fit: 30
  nq_ny_open_momentum:
    NQ:
      validated_positive: true
      n: 71
      min_n_for_poor_fit: 30
    MNQ:
      validated_positive: true
      n: 71
      min_n_for_poor_fit: 30
  nq_context_entry:
    NQ:
      validated_positive: true
      n: 57
      min_n_for_poor_fit: 30
      note: "Databento holdout WR~74% strict folds min>=65%"
    MNQ:
      validated_positive: true
      n: 57
      min_n_for_poor_fit: 30
      note: "Same rules as NQ; micro remap when risk cap binds"

# TradingView MTF Sweep Retest Assistant parity (strict all-3 HTF; 1m preferred)
indicator_parity:
  enabled: true
  use_vwap: true
  fast_ema: 20
  slow_ema: 50
  retest_zone_atr: 0.15
  sweep_valid_bars: 240
  stop_atr_mult: 1.0
  target_r_multiple: 2.0
  overext_atr: 1.8
  min_confidence: 0
  entry_mode: exact
  bar_interval: 1m
  bar_period: 7d

# Empirical ranking layer (does NOT bypass hard risk / data / duplicate gates)
performance_router:
  enabled: true
  min_sample: 30
  preferred_sample: 50
  include_shadow: true
  recent_n: 20
  trade_paths:
    - data/paper_trades.json
  shadow_path: data/shadow_trades.json

# router_v2: shrunk WR + calibrated model ranking — enable only after OOS proof
