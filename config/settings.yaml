  min_confidence: 64

# London / NY opening range (15m default research)
opening_range:
  enabled: true
  # Accuracy pass: VWAP align raised combined WR ~56.4%→56.8% with similar E;
  # ES-only ORB+VWAP hit ~62.5% WR / +0.39R (n=16, thin). Premarket ORB hit ~64% WR but weak E.
  duration_minutes: 15
  duration_minutes_ny: 5
  duration_minutes_london: 15
  entry_mode_ny: first_break
  entry_mode_london: retest
  max_breakout_body_atr: 1.25
  require_vwap_align: true
  sessions:
    london: "03:00"
    ny: "09:30"
  stop_atr_mult: 0.85
  target_r_multiple: 1.6
  # 0 = no local dollar cap (portfolio hard cap also disabled); full-size OR stops exceed $150
  max_risk_dollars: 0
  min_reward_dollars: 80
  min_confidence: 68
  require_retest: true  # default/fallback style when per-session mode unset

