[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-agent"
version = "0.1.0"
description = "Autonomous defined-risk options trading agent (IBKR paper-first)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "ib-insync>=0.9.86",
  "anthropic>=0.40.0",
  "pyyaml>=6.0",
  "python-dotenv>=1.0.0",
  "pydantic>=2.0",
  "pandas>=2.0",
  "numpy>=1.26",
  "httpx>=0.27.0",
  "apscheduler>=3.10.0",
  "tzdata>=2024.1",
  "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
trading-agent = "agent.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
